          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d project
          # If the ZIP contains one top-level directory, use it as the project root.
          if [ -f project/settings.gradle ] || [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            d="$(find project -maxdepth 2 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
            if [ -z "$d" ]; then
              echo "Could not find Gradle project"
              find project -maxdepth 3 -type f | head -100
              exit 1
            fi
            echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoShare-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
